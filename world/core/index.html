<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WordDark — Núcleo operacional</title>
<style>
:root{color-scheme:dark;--panel:#111823;--line:#293548;--text:#edf2f7;--muted:#9ba8ba;--accent:#e9a33a;--ok:#77d69b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#1a2434,#090d13 60%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:940px;margin:auto;padding:25px 20px 55px}.back{color:var(--muted);text-decoration:none}header{padding:32px 0 20px}.eyebrow{color:var(--accent);font-size:.82rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}h1{font-size:clamp(2rem,6vw,3.4rem);margin:7px 0}.sub{color:var(--muted);line-height:1.6}.panel{background:rgba(17,24,35,.94);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px}.flow{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.step{padding:11px 5px;text-align:center;border:1px solid #303c4f;border-radius:10px;font-size:.76rem;color:#c9d2df}.step.active{border-color:var(--accent);color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:12px 16px;background:var(--accent);font-weight:800;cursor:pointer}.secondary{background:#202a39;color:#e6edf5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1119;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:12px;max-height:560px;overflow:auto}.note{color:var(--muted);font-size:.9rem}.ok{color:var(--ok)}
@media(max-width:760px){.flow{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main><a class="back" href="../../">← WordDark</a>
<header><div class="eyebrow">Marco operacional</div><h1>⚙ Núcleo</h1><p class="sub">Teste integrado do circuito atual: identidade → acesso → operação → comunicação → Rodovia → Dark Factory → resultado → registro.</p></header>
<section class="panel"><div id="flow" class="flow"></div></section>
<section class="panel"><div class="actions"><button id="run" type="button">Executar teste integrado</button><button id="clear" class="secondary" type="button">Limpar resultado</button></div><p id="status" class="note">Nenhum teste executado.</p></section>
<section class="panel"><h2>Resultado do teste</h2><pre id="result">Aguardando execução...</pre></section>
</main>
<script src="../contracts/identity.js"></script><script src="../contracts/access.js"></script><script src="../security/security-manager.js"></script><script src="../security/account-manager.js"></script><script src="../contracts/operation.js"></script><script src="../contracts/message.js"></script><script src="../contracts/request.js"></script><script src="../contracts/receipt.js"></script><script src="../contracts/record.js"></script><script src="../contracts/route.js"></script><script src="../contracts/environment.js"></script><script src="../contracts/account.js"></script><script src="operation-engine.js"></script><script src="environment-guard.js"></script><script src="road.js"></script><script src="communication.js"></script><script src="world-runtime.js"></script><script src="../library/local-library.js"></script><script src="../library/central-library.js"></script><script src="operation-registry.js"></script><script src="../sky/darkfactory/core/request.js"></script><script src="../sky/darkfactory/core/logger.js"></script><script src="../sky/darkfactory/core/validator.js"></script><script src="../sky/darkfactory/core/executor.js"></script><script src="../sky/darkfactory/core/executor-manager.js"></script><script src="../sky/darkfactory/core/content-publication-executor.js"></script><script src="../sky/darkfactory/core/factory.js"></script><script src="../sky/darkfactory/core/operation-bridge.js"></script>
<script>
const stages=["CREATED","IDENTIFIED","AUTHORIZED","ROUTED","EXECUTING","VALIDATING","COMPLETED"],flow=document.getElementById("flow"),output=document.getElementById("result"),status=document.getElementById("status");
function draw(current){flow.innerHTML=stages.map(s=>'<div class="step '+(s===current?"active":"")+'">'+s+'</div>').join("")}draw("CREATED");
document.getElementById("clear").onclick=()=>{output.textContent="Aguardando execução...";status.textContent="Resultado limpo.";draw("CREATED")};
document.getElementById("run").onclick=()=>{
 try{
  const road=new WordDarkRoad();road.registerRoute(new WordDarkRoute({routeId:"ROUTE-TERRA-DF-PRODUCE",origin:"world/earth/demo-city",destination:"world/sky/darkfactory",service:"content.produce"}));road.registerRoute(new WordDarkRoute({routeId:"ROUTE-DF-TERRA-PRODUCE",origin:"world/sky/darkfactory",destination:"world/earth/demo-city",service:"content.produce"}));
  const security=new WordDarkSecurityManager(),accounts=new WordDarkAccountManager();accounts.register(new WordDarkAccount({accountId:"ACC-CITY-DEMO",identityId:"CITY-DEMO",type:"PERSONAL"}));security.registerIdentity(new WordDarkIdentity({identityId:"CITY-DEMO",type:"UNIT"}));security.grant(new WordDarkAccessRule({identityId:"CITY-DEMO",capability:"content.produce",action:"request",environment:"TEST",scope:"world/sky/darkfactory"}));
  const factory=new DarkFactory(),localLibrary=new WordDarkLocalLibrary({libraryId:"LIB-DEMO-LOCAL",ownerId:"world/earth/demo-city"}),centralLibrary=new WordDarkCentralLibrary(),registry=new WordDarkOperationRegistry({localLibrary,centralLibrary}),guard=new WordDarkEnvironmentGuard({environments:{TEST:new WordDarkEnvironment({name:"TEST"}),PROD:new WordDarkEnvironment({name:"PROD"})}}),communication=new WordDarkCommunication({road,registry}),bridge=new DarkFactoryOperationBridge({factory,communication});
  const engine=new WordDarkOperationEngine({security,route:op=>bridge.route(op),execute:op=>bridge.execute(op),registry,environmentGuard:guard,record:op=>draw(op.status)});
  const runtime=new WordDarkWorldRuntime({accountManager:accounts,security,environmentGuard:guard,road,registry,operationEngine:engine});
  const operation=runtime.createOperation({requesterId:"CITY-DEMO",originId:"world/earth/demo-city",destinationId:"world/sky/darkfactory",operationType:"content.produce",environment:"TEST",payload:{identityId:"CITY-DEMO",capability:"content.produce",action:"request",scope:"world/sky/darkfactory",task:"Produzir material de teste",contentId:"CONTENT-DEMO-001",title:"WordDark — primeiro circuito operacional",type:"VIDEO",requirements:{duration:"SHORT",format:"VERTICAL"},metadata:{source:"operation-mvp"}}});
  const result=runtime.runOperation(operation);draw(result.status);
  const passed=result.status==="COMPLETED"&&communication.messages.length===2&&communication.receipts.length===2&&localLibrary.list().length>0&&centralLibrary.count()>0&&security.getAudit().length>0;
  status.innerHTML=passed?'<span class="ok">TESTE CONCLUÍDO — circuito chegou a COMPLETED.</span>':"Teste terminou sem cumprir todos os critérios.";
  output.textContent=JSON.stringify({passed,status:result.status,operation:result.toJSON(),routes:road.listRoutes(),communication:communication.getStatus(),messages:communication.messages,receipts:communication.receipts,securityAudit:security.getAudit(),localLibrary:localLibrary.toJSON(),centralLibrary:centralLibrary.toJSON(),factory:factory.getStatus()},null,2);
 }catch(error){status.textContent="ERRO: "+error.message;output.textContent=JSON.stringify({passed:false,error:error.message,stack:error.stack},null,2)}
};
</script></body></html>
