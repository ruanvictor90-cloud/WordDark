<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WordDark — Operation MVP</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:24px;background:#111;color:#eee}
    h1{margin-bottom:4px}.muted{color:#aaa}.flow{display:grid;gap:8px;margin:20px 0}
    .step{padding:12px;border:1px solid #333;border-radius:10px;background:#191919}
    .done{border-color:#3b8}.fail{border-color:#b44}
    button{padding:12px 16px;border:0;border-radius:8px;cursor:pointer}
    pre{white-space:pre-wrap;background:#191919;padding:16px;border-radius:10px;overflow:auto}
  </style>
</head>
<body>
  <h1>WordDark — Operation MVP</h1>
  <div class="muted">Teste do primeiro circuito global: identidade → acesso → operação → rota → execução → validação → registro.</div>
  <div id="flow" class="flow" aria-live="polite"></div>
  <button id="run" type="button">Executar teste</button>
  <pre id="result">Aguardando operação...</pre>
  <script src="../contracts/operation.js"></script>
  <script src="operation-engine.js"></script>
  <script>
    const flow=document.getElementById("flow");
    const output=document.getElementById("result");
    const run=document.getElementById("run");
    const stages=["CREATED","IDENTIFIED","AUTHORIZED","ROUTED","EXECUTING","VALIDATING","COMPLETED"];
    function draw(current){
      flow.innerHTML="";
      stages.forEach(stage=>{
        const el=document.createElement("div");
        el.className="step"+(stage===current?" done":"");
        el.textContent=stage;
        flow.appendChild(el);
      });
    }
    draw("CREATED");
    run.addEventListener("click",()=>{
      const events=[];
      const engine=new WordDarkOperationEngine({
        authorize:()=>({allowed:true,reference:"AUTH-DEMO"}),
        route:()=>({success:true,routeId:"ROUTE-DEMO"}),
        execute:()=>({success:true,validated:true,result:{message:"Dark Factory recebeu e processou o serviço de teste."}}),
        record:op=>{events.push({status:op.status,at:op.updatedAt});draw(op.status)}
      });
      const operation=engine.create({
        requesterId:"CITY-DEMO",
        originId:"world/earth/demo-city",
        destinationId:"world/sky/darkfactory",
        operationType:"demo.circuit",
        environment:"TEST",
        payload:{purpose:"Validar o circuito global de operação"}
      });
      const result=engine.run(operation);
      output.textContent=JSON.stringify({operation:result.toJSON(),events},null,2);
    });
  </script>
</body>
</html>
