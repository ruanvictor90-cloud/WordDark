<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WordDark — Operation → Dark Factory</title>
<style>
body{font-family:system-ui,sans-serif;max-width:820px;margin:auto;padding:24px;background:#101010;color:#eee}
.muted{color:#aaa}.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:20px 0}
.step{padding:12px;border:1px solid #333;border-radius:10px;background:#191919;text-align:center;font-size:14px}.active{border-color:#6d8}.terminal{border-color:#58a}
button{padding:12px 16px;border:0;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;background:#191919;padding:16px;border-radius:10px;overflow:auto}
</style>
</head>
<body>
<h1>WordDark — Operation → Dark Factory</h1>
<p class="muted">Primeiro circuito integrado: Terra cria a operação, a Rodovia transporta, a Dark Factory executa e o resultado volta para a operação.</p>
<div id="flow" class="flow" aria-live="polite"></div>
<button id="run" type="button">Executar circuito real</button>
<pre id="result">Aguardando operação...</pre>

<script src="../contracts/identity.js"></script>
<script src="../contracts/access.js"></script>
<script src="../security/security-manager.js"></script>
<script src="../security/account-manager.js"></script>
<script src="../contracts/operation.js"></script>
<script src="../contracts/message.js"></script>
<script src="../contracts/request.js"></script>
<script src="../contracts/receipt.js"></script>
<script src="../contracts/record.js"></script>
<script src="../contracts/route.js"></script>
<script src="../contracts/environment.js"></script>
<script src="../contracts/account.js"></script>
<script src="operation-engine.js"></script>
<script src="environment-guard.js"></script>
<script src="road.js"></script>
<script src="communication.js"></script>
<script src="world-runtime.js"></script>
<script src="../library/local-library.js"></script>
<script src="../library/central-library.js"></script>
<script src="operation-registry.js"></script>

<script src="../sky/darkfactory/core/request.js"></script>
<script src="../sky/darkfactory/core/logger.js"></script>
<script src="../sky/darkfactory/core/validator.js"></script>
<script src="../sky/darkfactory/core/executor.js"></script>
<script src="../sky/darkfactory/core/executor-manager.js"></script>
<script src="../sky/darkfactory/core/content-publication-executor.js"></script>
<script src="../sky/darkfactory/core/factory.js"></script>
<script src="../sky/darkfactory/routing/router.js"></script>
<script src="../sky/darkfactory/core/operation-bridge.js"></script>

<script>
const stages=["CREATED","IDENTIFIED","AUTHORIZED","ROUTED","EXECUTING","VALIDATING","COMPLETED"];
const flow=document.getElementById("flow"), output=document.getElementById("result"), run=document.getElementById("run");
function draw(current){
 flow.innerHTML="";
 stages.forEach(stage=>{
  const e=document.createElement("div");
  e.className="step"+(stage===current?" active":"");
  e.textContent=stage;
  flow.appendChild(e);
 });
}
draw("CREATED");

run.addEventListener("click",()=>{
 try{
  const road=new WordDarkRoad();
  const outboundRoute=new WordDarkRoute({
   routeId:"ROUTE-TERRA-DF-PRODUCE",
   origin:"world/earth/demo-city",
   destination:"world/sky/darkfactory",
   service:"content.produce"
  });
  const returnRoute=new WordDarkRoute({
   routeId:"ROUTE-DF-TERRA-PRODUCE",
   origin:"world/sky/darkfactory",
   destination:"world/earth/demo-city",
   service:"content.produce"
  });
  road.registerRoute(outboundRoute);
  road.registerRoute(returnRoute);
  const security=new WordDarkSecurityManager();
  const accountManager=new WordDarkAccountManager();
  accountManager.register(new WordDarkAccount({accountId:"ACC-CITY-DEMO",identityId:"CITY-DEMO",type:"PERSONAL"}));
  security.registerIdentity(new WordDarkIdentity({identityId:"CITY-DEMO",type:"UNIT"}));
  security.grant(new WordDarkAccessRule({
   identityId:"CITY-DEMO",
   capability:"content.produce",
   action:"request",
   environment:"TEST",
   scope:"world/sky/darkfactory"
  }));
  const factory=new DarkFactory();
  const events=[];
  const localLibrary=new WordDarkLocalLibrary({libraryId:"LIB-DEMO-LOCAL",ownerId:"world/earth/demo-city"});
  const centralLibrary=new WordDarkCentralLibrary();
  const registry=new WordDarkOperationRegistry({localLibrary,centralLibrary});
  const environmentGuard=new WordDarkEnvironmentGuard({environments:{TEST:new WordDarkEnvironment({name:"TEST"}),PROD:new WordDarkEnvironment({name:"PROD"})}});
  const communication=new WordDarkCommunication({road,registry});
  const bridge=new DarkFactoryOperationBridge({factory,communication});
  const engine=new WordDarkOperationEngine({
   security,
   route:op=>bridge.route(op),
   execute:op=>bridge.execute(op),
   registry,
   environmentGuard,
   record:op=>{events.push({status:op.status,at:op.updatedAt});draw(op.status)}
  });
  const runtime=new WordDarkWorldRuntime({accountManager,security,environmentGuard,road,registry,operationEngine:engine});
  const operation=runtime.createOperation({
   requesterId:"CITY-DEMO",
   originId:"world/earth/demo-city",
   destinationId:"world/sky/darkfactory",
   operationType:"content.produce",
   environment:"TEST",
   payload:{
    identityId:"CITY-DEMO",
    capability:"content.produce",
    action:"request",
    scope:"world/sky/darkfactory",
    task:"Produzir material de teste",
    contentId:"CONTENT-DEMO-001",
    title:"WordDark — primeiro circuito operacional",
    type:"VIDEO",
    requirements:{duration:"SHORT",format:"VERTICAL"},
    metadata:{source:"operation-mvp"}
   }
  });
  const result=runtime.runOperation(operation);
  output.textContent=JSON.stringify({
   operation:result.toJSON(),
   factoryStatus:factory.getStatus(),
   factoryLogs:factory.getRequestLogs(),
   runtime:runtime.getStatus(),
   routes:road.listRoutes(),
   communication:communication.getStatus(),
   receipts:communication.receipts,
   messages:communication.messages,
   road:road.getStatus(),
   accounts:accountManager.list(),
   securityAudit:security.getAudit(),
   events,
   localLibrary:localLibrary.toJSON(),
   centralLibrary:centralLibrary.toJSON()
  },null,2);
 }catch(error){
  output.textContent=JSON.stringify({error:error.message,stack:error.stack},null,2);
 }
});
</script>
</body>
</html>
